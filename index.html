<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-In-One Safe App</title>
    
    <!-- REACT & BABEL CDNs (Allows React & JSX in a single HTML file) -->
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com"></script>

    <!-- INLINE CSS STYLE SHEET -->
    <style>
        :root {
            --primary: #2563eb;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .card {
            background: var(--card);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .flex-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input, textarea {
            flex: 1;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }
        textarea {
            font-family: monospace;
            height: 100px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { opacity: 0.9; }
        button.danger { background-color: var(--danger); }
        .badge {
            background: #e2e8f0;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        ul { list-style: none; padding: 0; }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f1f5f9;
            margin-bottom: 8px;
            border-radius: 6px;
        }
        pre {
            background: #0f172a;
            color: #38bdf8;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
        }
    </style>
</head>
<body>

    <!-- HTML Root element where React will mount -->
    <div id="root"></div>

    <!-- JAVASCRIPT & REACT COMPONENTS ENGINE -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        // HARDCODED INITIAL JSON DATA CONFIGURATION
        const initialJsonConfig = {
            "maxDevices": 100,
            "blockedDomains": ["bad-website.com", "distraction.com"]
        };

        function App() {
            // REACT STATES
            const [config, setConfig] = useState(initialJsonConfig);
            const [newDomain, setNewDomain] = useState("");
            const [javaCode, setJavaCode] = useState(
`public class Main {
    public static void main(String[] args) {
        System.out.println("Checking device network configuration...");
    }
}`
            );
            const [javaOutput, setJavaOutput] = useState("");

            // JAVASCRIPT: Block Website logic
            const handleBlockSite = () => {
                if (!newDomain) return;
                const updatedDomains = [...config.blockedDomains, newDomain.trim().toLowerCase()];
                
                // Update dynamic state payload object
                setConfig({
                    ...config,
                    blockedDomains: updatedDomains
                });
                setNewDomain("");
            };

            // JAVASCRIPT: Unblock Website logic
            const handleUnblockSite = (domainToRemove) => {
                setConfig({
                    ...config,
                    blockedDomains: config.blockedDomains.filter(d => d !== domainToRemove)
                });
            };

            // JAVASCRIPT: Simulating a Java Compiler pipeline
            const runJavaSimulation = () => {
                setJavaOutput("Compiling Java program...\n");
                
                // Convert current UI rules into a JSON string sent to our mock Java environment
                const simulatedJsonPayload = JSON.stringify(config);
                
                setTimeout(() => {
                    if (javaCode.includes("System.out.println")) {
                        setJavaOutput(
                            `[INFO] Java Virtual Machine started.\n` +
                            `[JSON Received by Java app]: ${simulatedJsonPayload}\n\n` +
                            `[CONSOLE OUTPUT]:\nExecuting web filter block policy active for ${config.blockedDomains.length} domains.`
                        );
                    } else {
                        setJavaOutput("Java Compilation Error: missing expected syntax patterns.");
                    }
                }, 800);
            };

            return (
                <div class="container">
                    <div class="header">
                        <h1>🛡️ Safe Guard Master Console</h1>
                        <p>HTML, CSS, React, JSON, JS, and Java operating unified.</p>
                    </div>

                    {/* BLOCKED WEBSITES CONTROLLER (React + JS) */}
                    <div class="card">
                        <h2>🌐 Website Firewall Manager</h2>
                        <p>Connected Devices capacity limit: <span class="badge">{config.maxDevices} Max</span></p>
                        
                        <div class="flex-group">
                            <input 
                                type="text" 
                                placeholder="enter domain name (e.g., gaming.com)" 
                                value={newDomain}
                                onChange={(e) => setNewDomain(e.target.value)}
                            />
                            <button onClick={handleBlockSite}>Enforce Block</button>
                        </div>

                        <ul>
                            {config.blockedDomains.map((domain, index) => (
                                <li key={index}>
                                    <span>🛑 {domain}</span>
                                    <button class="danger" onClick={() => handleUnblockSite(domain)}>Allow</button>
                                </li>
                            ))}
                        </ul>
                    </div>

                    {/* LIVE JSON DATA VIEWER */}
                    <div class="card">
                        <h2>📋 Raw JSON Configuration Payload</h2>
                        <p>This reactive state object updates dynamically as rules modify.</p>
                        <pre>{JSON.stringify(config, null, 2)}</pre>
                    </div>

                    {/* JAVA WORKSPACE ENVIRONMENT SIMULATOR */}
                    <div class="card">
                        <h2>☕ Java Code Execution Simulator</h2>
                        <p>Write standard Java code to see how a device config payload passes runtime processing parameters.</p>
                        <textarea 
                            value={javaCode} 
                            onChange={(e) => setJavaCode(e.target.value)}
                        />
                        <button style={{marginTop: '10px'}} onClick={runJavaSimulation}>Compile & Execute Java</button>
                        
                        <h3>Execution Output Terminal:</h3>
                        <pre style={{background: '#1e1e1e', color: '#4af626'}}>{javaOutput || "Idle. Click 'Compile & Execute' to start runtime stack simulation."}</pre>
                    </div>
                </div>
            );
        }

        // Mount the React Application layout down into the HTML #root DOM node
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
